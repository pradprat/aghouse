name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same ref so a quick follow-up push doesn't burn extra Windows minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build AgHouse.slnx --configuration Release --nologo

      - name: Test
        run: dotnet test AgHouse.slnx --configuration Release --no-build --nologo
