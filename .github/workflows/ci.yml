name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same ref so a quick follow-up push doesn't burn extra Windows minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build AgHouse.slnx --configuration Release --nologo

      - name: Test
        run: dotnet test AgHouse.slnx --configuration Release --no-build --nologo
