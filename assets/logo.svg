<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>aghouse</title>
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4CC2FF"/>
      <stop offset="1" stop-color="#0F6CBD"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3A"/>
      <stop offset="1" stop-color="#1E1E1E"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FFB900"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Body: a terminal window -->
    <rect x="40" y="96" width="176" height="136" rx="20" fill="url(#body)"/>
    <rect x="40.75" y="96.75" width="174.5" height="134.5" rx="19.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5"/>

    <!-- Roof -->
    <path d="M128 26 L230 110 L26 110 Z" fill="url(#roof)" stroke="url(#roof)" stroke-width="14" stroke-linejoin="round"/>
  </g>

  <!-- Split divider -->
  <rect x="126.5" y="134" width="3" height="80" rx="1.5" fill="#FFFFFF" fill-opacity="0.12"/>

  <!-- Left pane: prompt -->
  <path d="M60 150 L78 166 L60 182" fill="none" stroke="#4CC2FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="86" y="177" width="26" height="8" rx="3" fill="#EDEDED"/>

  <!-- Right pane: output lines -->
  <rect x="144" y="148" width="54" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.32"/>
  <rect x="144" y="164" width="36" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.22"/>
  <rect x="144" y="180" width="46" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.22"/>

  <!-- Attention dot (where the chimney would be) -->
  <circle cx="198" cy="54" r="24" fill="none" stroke="#FFB900" stroke-opacity="0.35" stroke-width="4"/>
  <circle cx="198" cy="54" r="15" fill="url(#dot)"/>
</svg>
